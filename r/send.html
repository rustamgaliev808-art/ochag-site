<!doctype html><meta charset="utf-8"><title>send</title><body>sending…<script>
(async()=>{
const C=1900000;
const files=JSON.parse(localStorage.getItem('och_q')||'[]');
let st=JSON.parse(localStorage.getItem('och_st')||'{"f":0,"p":0}');
const h=location.hash.slice(1);
if(h.startsWith('ack=')){const [f,p,n]=h.slice(4).split(':').map(Number); if(p+1<n){st={f,p:p+1}}else{st={f:f+1,p:0}} localStorage.setItem('och_st',JSON.stringify(st));}
if(st.f>=files.length){document.body.textContent='DONE';return;}
const name=files[st.f];
const b=await (await fetch('/r/'+name,{cache:'force-cache'})).blob();
const s=await new Promise(r=>{const fr=new FileReader(); fr.onload=()=>r(fr.result.split(',')[1]); fr.readAsDataURL(b)});
const n=Math.ceil(s.length/C); const part=s.slice(st.p*C,(st.p+1)*C);
location.href='https://www.instagram.com/#och='+st.f+':'+st.p+':'+n+':'+name+':'+part;
})();
</script>
